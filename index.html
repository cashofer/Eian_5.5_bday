  <title>寶貝仔6.5歲生日</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== "undefined" ? __app_id : "default-app-id";
    const firebaseConfigRaw = typeof __firebase_config !== "undefined" ? __firebase_config : "";
    const initialAuthToken = typeof __initial_auth_token !== "undefined" ? __initial_auth_token : "";

    let db = null;
    let auth = null;
    let currentUserId = null;
    const LOCAL_STORAGE_KEY = "eian_5_5_birthday_bball_progress_v1";

    function loadSavedProgressFromLocal() {
      try {
        if (typeof localStorage === "undefined") return;
        const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (!data || typeof data !== "object") return;

        if (Array.isArray(data.unlockedIds) && data.unlockedIds.length > 0) {
          const validIds = data.unlockedIds
            .map((id) => Number(id))
            .filter((id) => Number.isInteger(id) && id >= 1 && id <= 1025);
          if (validIds.length > 0) {
            const existingSet = window.unlockedPokemonIds || new Set(window.INITIAL_UNLOCKED_IDS || []);
            window.unlockedPokemonIds = new Set([
              ...(window.INITIAL_UNLOCKED_IDS || []),
              ...existingSet,
              ...validIds
            ]);
          }
        }

        if (Array.isArray(data.selectedHomeIds) && data.selectedHomeIds.length > 0) {
          const validSelected = data.selectedHomeIds
            .map((id) => Number(id))
            .filter((id) => (window.unlockedPokemonIds || new Set()).has(id))
            .slice(0, 3);
          if (validSelected.length > 0) {
            window.selectedHomeIds = validSelected;
          }
        }

        if (data.matchRecord && typeof data.matchRecord === "object") {
          const prevRec = window.matchRecord || {
            bestHomeScore: 0,
            bestGoalDiff: -999,
            wins: 0,
            matchesPlayed: 0
          };
          const localScore = Number(data.matchRecord.bestHomeScore) || 0;
          const localDiff = Number.isFinite(Number(data.matchRecord.bestGoalDiff)) ? Number(data.matchRecord.bestGoalDiff) : -999;
          const localWins = Number(data.matchRecord.wins) || 0;
          const localPlayed = Number(data.matchRecord.matchesPlayed) || 0;
          const prevDiff = Number.isFinite(Number(prevRec.bestGoalDiff)) ? Number(prevRec.bestGoalDiff) : -999;

          window.matchRecord = {
            bestHomeScore: Math.max(Number(prevRec.bestHomeScore) || 0, localScore),
            bestGoalDiff: Math.max(prevDiff, localDiff),
            wins: Math.max(Number(prevRec.wins) || 0, localWins),
            matchesPlayed: Math.max(Number(prevRec.matchesPlayed) || 0, localPlayed)
          };
          if (typeof window.syncMatchRecordUI === "function") {
            window.syncMatchRecordUI();
          }
        }
      } catch (err) {
        console.error("Failed to load progress from localStorage:", err);
      }
    }

    function saveProgressToLocal(unlockedArray, selectedArray, recordObj) {
      try {
        if (typeof localStorage === "undefined") return;
        localStorage.setItem(
          LOCAL_STORAGE_KEY,
          JSON.stringify({
            unlockedIds: unlockedArray,
            selectedHomeIds: selectedArray,
            matchRecord: recordObj,
            updatedAt: Date.now()
          })
        );
      } catch (err) {
        console.error("Failed to save progress to localStorage:", err);
      }
    }

    async function initProgressStorage() {
      try {
        loadSavedProgressFromLocal();
        if (typeof window.renderHomeScreen === "function") {
          window.renderHomeScreen();
        }
        if (!firebaseConfigRaw) return;
        const firebaseConfig = JSON.parse(firebaseConfigRaw);
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        if (initialAuthToken) {
          await signInWithCustomToken(auth, initialAuthToken);
        } else {
          await signInAnonymously(auth);
        }

        currentUserId = auth.currentUser?.uid || null;
        if (!currentUserId) return;

        await loadSavedProgressFromCloud();
      } catch (err) {
        console.error("Failed to initialize progress storage:", err);
      }
    }

    async function loadSavedProgressFromCloud() {
      try {
        if (!db || !currentUserId) return;
        const progressRef = doc(db, "artifacts", appId, "users", currentUserId, "gameProgress", "main");
        const snap = await getDoc(progressRef);
        if (!snap.exists()) return;

        const data = snap.data() || {};
        if (Array.isArray(data.unlockedIds) && data.unlockedIds.length > 0) {
          const validIds = data.unlockedIds
            .map((id) => Number(id))
            .filter((id) => Number.isInteger(id) && id >= 1 && id <= 1025);
          if (validIds.length > 0) {
            const existingSet = window.unlockedPokemonIds || new Set(window.INITIAL_UNLOCKED_IDS || []);
            window.unlockedPokemonIds = new Set([
              ...(window.INITIAL_UNLOCKED_IDS || []),
              ...existingSet,
              ...validIds
            ]);
          }
        }

        if (Array.isArray(data.selectedHomeIds) && data.selectedHomeIds.length > 0) {
          const validSelected = data.selectedHomeIds
            .map((id) => Number(id))
            .filter((id) => (window.unlockedPokemonIds || new Set()).has(id))
            .slice(0, 3);
          if (validSelected.length > 0) {
            window.selectedHomeIds = validSelected;
          }
        }

        if (data.matchRecord && typeof data.matchRecord === "object") {
          const prevRec = window.matchRecord || {
            bestHomeScore: 0,
            bestGoalDiff: -999,
            wins: 0,
            matchesPlayed: 0
          };
          const cloudScore = Number(data.matchRecord.bestHomeScore) || 0;
          const cloudDiff = Number.isFinite(Number(data.matchRecord.bestGoalDiff)) ? Number(data.matchRecord.bestGoalDiff) : -999;
          const cloudWins = Number(data.matchRecord.wins) || 0;
          const cloudPlayed = Number(data.matchRecord.matchesPlayed) || 0;
          const prevDiff = Number.isFinite(Number(prevRec.bestGoalDiff)) ? Number(prevRec.bestGoalDiff) : -999;

          window.matchRecord = {
            bestHomeScore: Math.max(Number(prevRec.bestHomeScore) || 0, cloudScore),
            bestGoalDiff: Math.max(prevDiff, cloudDiff),
            wins: Math.max(Number(prevRec.wins) || 0, cloudWins),
            matchesPlayed: Math.max(Number(prevRec.matchesPlayed) || 0, cloudPlayed)
          };
          if (typeof window.syncMatchRecordUI === "function") {
            window.syncMatchRecordUI();
          }
        }

        if (typeof window.renderHomeScreen === "function") {
          window.renderHomeScreen();
        }
        const dexModal = document.getElementById("dex-modal");
        if (dexModal && dexModal.classList.contains("active") && typeof window.openDexModal === "function") {
          window.openDexModal();
        }
      } catch (err) {
        console.error("Failed to load saved progress:", err);
      }
    }

    async function saveProgressToCloud() {
      try {
        const unlockedArray = Array.from(
          new Set([...window.INITIAL_UNLOCKED_IDS, ...(window.unlockedPokemonIds || [])])
        );
        const selectedArray = Array.from(window.selectedHomeIds || []).filter((id) =>
          unlockedArray.includes(Number(id))
        );
        window.unlockedPokemonIds = new Set(unlockedArray);
        if (selectedArray.length > 0) {
          window.selectedHomeIds = selectedArray.slice(0, 3);
        }
        const activeRecord = window.matchRecord || {
          bestHomeScore: 0,
          bestGoalDiff: -999,
          wins: 0,
          matchesPlayed: 0
        };
        saveProgressToLocal(unlockedArray, window.selectedHomeIds || [], activeRecord);

        if (!db || !currentUserId) return;
        const progressRef = doc(db, "artifacts", appId, "users", currentUserId, "gameProgress", "main");
        await setDoc(
          progressRef,
          {
            unlockedIds: unlockedArray,
            selectedHomeIds: window.selectedHomeIds || [],
            matchRecord: activeRecord,
            updatedAt: Date.now()
          },
          { merge: true }
        );
      } catch (err) {
        console.error("Failed to save progress:", err);
      }
    }

    window.saveGameProgress = saveProgressToCloud;

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initProgressStorage);
    } else {
      initProgressStorage();
    }
  </script>

    .glass-panel {

      border-radius: 16px;

    #joystick-zone {

      backdrop-filter: blur(8px);
      touch-action: none;
    }

    #joystick-ring-guide {
      position: absolute;
      inset: 14px;
      border-radius: 9999px;
      border: 1px dashed rgba(148, 163, 184, 0.25);
      pointer-events: none;
    }

    #joystick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 50px;
      height: 50px;
      margin-left: -25px;
      margin-top: -25px;
      border-radius: 9999px;
      background: radial-gradient(circle at 32% 30%, #60a5fa, #2563eb 68%, #1d4ed8 100%);
      border: 2px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.55);
      transform: translate(0px, 0px);
      transition: transform 0.05s linear;
      pointer-events: none;
    }

    #joystick-knob.dragging {
      transition: none;
      background: radial-gradient(circle at 32% 30%, #93c5fd, #3b82f6 68%, #1d4ed8 100%);
      box-shadow: 0 0 18px rgba(96, 165, 250, 0.85);
    }

    .action-btn {
      border-radius: 16px;
      font-weight: 800;
      letter-spacing: 0.03em;
      transition: transform 0.1s ease, filter 0.15s ease, background-color 0.15s ease;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
    }

    .action-btn:active {
      transform: scale(0.94);
      filter: brightness(1.12);
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(2, 6, 23, 0.78);
      backdrop-filter: blur(6px);
      overflow-y: auto;
      touch-action: pan-y;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .pokemon-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1.5px solid rgba(148, 163, 184, 0.22);
      border-radius: 16px;
      transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
    }

    .pokemon-card:hover {
      transform: translateY(-2px);
      border-color: rgba(96, 165, 250, 0.65);
    }

    .pokemon-card.selected-home {
      border-color: #facc15;
      box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.35), 0 10px 20px rgba(0, 0, 0, 0.4);
      background: linear-gradient(180deg, rgba(30, 58, 138, 0.65) 0%, rgba(15, 23, 42, 0.95) 100%);
    }

    .pokemon-card.locked-card {
      opacity: 0.65;
      background: rgba(10, 15, 28, 0.85);
    }
  </style>

    async function fetchRemotePokemonName(id) {
      if (KNOWN_POKEMON_NAMES[id]) return KNOWN_POKEMON_NAMES[id];
      if (fetchedRemotePokemonNames.has(id)) return fetchedRemotePokemonNames.get(id);
      try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}/`);
        if (!res.ok) return null;
        const data = await res.json();
        const names = Array.isArray(data.names) ? data.names : [];
        const zhHant = names.find((n) => n.language?.name === "zh-Hant")?.name;
        const zhHans = names.find((n) => n.language?.name === "zh-Hans")?.name;
        const enName = names.find((n) => n.language?.name === "en")?.name;
        const resolvedName = zhHant || zhHans || enName || null;
        if (resolvedName) {
          fetchedRemotePokemonNames.set(id, resolvedName);
          const spec = POKEMON_MAP.get(id);
          if (spec) {
            spec.name = resolvedName;
          }
        }
        return resolvedName;
      } catch (err) {
        console.error(`Failed to fetch pokemon #${id} name:`, err);
        return null;
      }
    }

      function buildFourthDistractor(answer, subject, existingOptions) {
        const used = new Set((existingOptions || []).map((o) => String(o).trim()));
        const ansStr = String(answer ?? "").trim();
        used.add(ansStr);
        if (/^[a-zA-Zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ\s]+$/.test(ansStr)) {
          const engPool = ["Apple", "Book", "Cat", "Dog", "Sun", "Tree", "Ball", "Milk", "Bird", "Red", "Blue", "Green"];
          for (const w of engPool) {
            if (!used.has(w)) return w;
          }
        }
        const zhPool = subject === "普通話"
          ? ["b", "p", "m", "f", "d", "t", "n", "l", "a", "o", "e", "i", "u", "ü", "ai", "ao"]
          : ["個", "隻", "條", "張", "棵", "本", "朵", "杯", "塊", "大", "小", "上", "下", "快", "慢"];
        for (const z of zhPool) {
          if (!used.has(z)) return z;
        }
        return `${ansStr}！`;
      }

      function pushUniqueQuestion(q) {
        const cleanOptions = [];
        const optSet = new Set();
        const rawList = Array.isArray(q.options) ? [...q.options] : [];
        const fourth = buildFourthDistractor(q.answer, q.subject, rawList);
        rawList.push(fourth);

        for (const opt of rawList) {
          const val = String(opt).trim();
          if (!val || optSet.has(val)) continue;
          optSet.add(val);
          cleanOptions.push(val);
        }
        if (cleanOptions.length < 4) return;
        const shuffled = cleanOptions.slice(0, 4);
        const correctStr = String(q.answer).trim();
        if (!shuffled.includes(correctStr)) {
          shuffled[0] = correctStr;
        }
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        const key = `${q.subject}|${q.question}`;

          subject: q.subject,
          difficulty: q.difficulty === "hard" ? "hard" : "easy",
          question: q.question,
          options: shuffled,
          answer: correctStr

      richMandarinBank.forEach((item) => {

      // 產生大量真正不同的數學算式（加法、減法、乘法、比大小與缺數）
      for (let i = 1; i <= 180; i++) {
        const mode = i % 5;
        if (mode === 0) {
          const a = (i % 15) + 2;
          const b = ((i * 3) % 12) + 1;
          const ans = a + b;
          pushUniqueQuestion({
            subject: "數學",
            difficulty: ans > 15 ? "hard" : "easy",
            question: `${a} + ${b} 等於多少？`,
            options: [String(ans), String(ans + 2), String(Math.max(1, ans - 1))],
            answer: String(ans)
          });
        } else if (mode === 1) {
          const b = ((i * 2) % 9) + 1;
          const a = b + ((i % 14) + 2);
          const ans = a - b;
          pushUniqueQuestion({
            subject: "數學",
            difficulty: a > 16 ? "hard" : "easy",
            question: `${a} 減去 ${b} 等於多少？`,
            options: [String(ans), String(ans + 1), String(Math.max(0, ans - 2))],
            answer: String(ans)
          });
        } else if (mode === 2) {
          const m1 = ((i % 6) + 2);
          const m2 = (((i + 2) % 5) + 2);
          const ans = m1 * m2;
          pushUniqueQuestion({
            subject: "數學",
            difficulty: "hard",
            question: `${m1} × ${m2} = ?`,
            options: [String(ans), String(ans + m1), String(Math.max(1, ans - m2))],
            answer: String(ans)
          });
        } else if (mode === 3) {
          const left = ((i * 5) % 28) + 3;
          const right = ((i * 7 + 4) % 28) + 3;
          if (left !== right) {
            const ans = String(Math.max(left, right));
            const other = String(Math.min(left, right));
            pushUniqueQuestion({
              subject: "數學",
              difficulty: left > 18 || right > 18 ? "hard" : "easy",
              question: `${left} 和 ${right}，哪一個數字比較大？`,
              options: [ans, other, String(Math.abs(left - right) + 1)],
              answer: ans
            });
          }
        } else {
          const partA = ((i % 9) + 2);
          const partB = (((i + 4) % 9) + 2);
          const total = partA + partB;
          pushUniqueQuestion({
            subject: "數學",
            difficulty: total > 14 ? "hard" : "easy",

      // 補充其餘題目至 1600 題，不加上重複字樣
      let genIndex = 1;
      const subjectsCycle = ["普通話", "英文", "中文", "數學"];
      while (bank.length < 1600 && genIndex <= 8000) {

            subject: "中文",
            difficulty: isHard ? "hard" : "easy",
            question: base.q,
            options: [base.ans, ...base.w],
            answer: base.ans
          });
        } else {
          const x = ((genIndex * 3) % 25) + 4;
          const y = ((genIndex * 2) % 12) + 1;
          const isSub = genIndex % 3 === 0;
          const ans = isSub ? x - y : x + y;
          const qText = isSub ? `${x} - ${y} = ?` : `${x} + ${y} = ?`;
          pushUniqueQuestion({
            subject: "數學",
            difficulty: isHard ? "hard" : "easy",
            question: qText,
            options: [String(ans), String(ans + 2), String(Math.max(0, ans - 1))],
            answer: String(ans)
          });
        }
        genIndex++;
      }

      return bank.slice(0, 1600);
    }

    function shuffleQuestionArray(items) {
      const arr = [...items];
      for (let i = arr.length - 1; i > 0; i--) {

        [arr[i], arr[j]] = [arr[j], arr[i]];

    function drawRoundedRectPath(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
    }

    function getQuestionUniqueKey(q) {
      const cleanQ = String(q?.question || "")
        .replace(/（第\d+題）|\(#\d+\)|（題\d+）/g, "")
        .replace(/^(請選出|想一想，|找一找：|一起學：|拼讀練習：|聽音辨字：|Quick check:\s*|Let's answer:\s*|Look & pick:\s*|Try this:\s*|English fun:\s*|Can you tell:\s*|填一填：|想一想：|選一選：|語文小測：|詞語練習：|算一算：|動腦筋：|快算看：|挑戰題：|數學小達人：|心算一下：)/g, "")
        .replace(/\s+/g, "")
        .trim();
      const cleanA = String(q?.answer || "").replace(/\s+/g, "").trim();
      return `${q?.subject || ""}::${cleanQ}::${cleanA}`;
    }

    function pickNextQuestion(isThreePt) {
      const desiredDiff = isThreePt ? "hard" : "easy";
      const subjectOrder = ["普通話", "英文", "中文", "數學"];
      const targetSubject = subjectOrder[subjectRotationIndex % subjectOrder.length];
      subjectRotationIndex++;

      const totalBank = ROTATED_QUESTION_POOL.length;
      if (totalBank === 0) return null;

      function isUsedInCurrentMatch(q, key, idx) {
        if (usedMatchQuestionIndices.has(idx)) return true;
        if (usedMatchQuestionKeys.has(key)) return true;
        const rawQ = String(q?.question || "").replace(/\s+/g, "").trim();
        for (const usedKey of usedMatchQuestionKeys) {
          const parts = usedKey.split("::");
          if (parts[1] && rawQ && parts[1] === rawQ) {
            return true;
          }
        }
        return false;
      }

      function findFirstRotatedIndex(predicate, allowRepeatInMatch) {
        for (let offset = 0; offset < totalBank; offset++) {
          const idx = (crossMatchCursor + offset) % totalBank;
          const q = ROTATED_QUESTION_POOL[idx];
          const key = getQuestionUniqueKey(q);
          if (!allowRepeatInMatch && isUsedInCurrentMatch(q, key, idx)) {
            continue;
          }
          if (predicate(q, key, idx)) {
            return idx;
          }
        }
        return -1;
      }

      // 嚴格優先：同一賽事內絕不重複 + 近期未出過 + 符合科目與難度
      let chosenIdx = findFirstRotatedIndex(
        (q, key) => q.subject === targetSubject && q.difficulty === desiredDiff && !usedRecentMatchQuestionKeys.has(key),
        false
      );

      if (chosenIdx === -1) {
        chosenIdx = findFirstRotatedIndex(
          (q, key) => q.subject === targetSubject && !usedRecentMatchQuestionKeys.has(key),
          false
        );
      }

      if (chosenIdx === -1) {
        chosenIdx = findFirstRotatedIndex(
          (q, key) => q.difficulty === desiredDiff && !usedRecentMatchQuestionKeys.has(key),
          false
        );
      }

      if (chosenIdx === -1) {
        chosenIdx = findFirstRotatedIndex((_, key) => !usedRecentMatchQuestionKeys.has(key), false);
      }

      if (chosenIdx === -1) {
        chosenIdx = findFirstRotatedIndex((q) => q.subject === targetSubject && q.difficulty === desiredDiff, false);
      }

      if (chosenIdx === -1) {
        chosenIdx = findFirstRotatedIndex((q) => q.subject === targetSubject, false);
      }

      if (chosenIdx === -1) {
        chosenIdx = findFirstRotatedIndex(() => true, false);
      }

      if (chosenIdx === -1) {
        // 僅在整份 1600 題庫皆已在同一場用完時才放寬單場限制並清空近期紀錄
        usedRecentMatchQuestionKeys.clear();
        usedMatchQuestionKeys.clear();
        usedMatchQuestionIndices.clear();
        chosenIdx = crossMatchCursor % totalBank;
      }

      crossMatchCursor = (chosenIdx + 1) % totalBank;

      const pick = ROTATED_QUESTION_POOL[chosenIdx];
      const pickKey = getQuestionUniqueKey(pick);
      const rawPickKey = `${pick?.subject || ""}::${String(pick?.question || "").replace(/\s+/g, "").trim()}::${String(pick?.answer || "").replace(/\s+/g, "").trim()}`;
      usedMatchQuestionKeys.add(pickKey);
      usedMatchQuestionKeys.add(rawPickKey);
      usedRecentMatchQuestionKeys.add(pickKey);
      usedMatchQuestionIndices.add(chosenIdx);

      // 保留最近約 85% 的題目不重複，讓整批 1600 題輪流出現
      const maxRecentWindow = Math.max(100, Math.floor(totalBank * 0.85));
      while (usedRecentMatchQuestionKeys.size > maxRecentWindow) {
        const oldestKey = usedRecentMatchQuestionKeys.values().next().value;
        if (!oldestKey) break;
        usedRecentMatchQuestionKeys.delete(oldestKey);
      }

      saveQuestionRotationState();
      return pick;
    }

          opacity: 1
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(originVec);
        const angle = (i / count) * Math.PI * 2 + Math.random() * 0.4;
        const speed = isScoreBurst ? 2.4 + Math.random() * 2.2 : 1.2 + Math.random() * 1.4;
        scene.add(mesh);
        shotParticles.push({
          mesh,
          vel: new THREE.Vector3(
            Math.cos(angle) * speed,
            1.4 + Math.random() * 2.0,
            Math.sin(angle) * speed
          ),
          life: isScoreBurst ? 0.65 : 0.4,
          maxLife: isScoreBurst ? 0.65 : 0.4
        });
      }
    }

    function updateShotParticles(dt) {
      for (let i = shotParticles.length - 1; i >= 0; i--) {
        const pt = shotParticles[i];
        pt.life -= dt;
        if (pt.life <= 0) {
          scene.remove(pt.mesh);
          shotParticles.splice(i, 1);
          continue;
        }
        pt.mesh.position.addScaledVector(pt.vel, dt);
        pt.vel.y -= 6.5 * dt;
        const ratio = Math.max(0, pt.life / pt.maxLife);
        pt.mesh.scale.setScalar(ratio);
        if (pt.mesh.material) {
          pt.mesh.material.opacity = ratio;
        }
      }
    }

    function initScene() {
      const canvas = document.getElementById("three-canvas");
      if (!canvas || typeof THREE === "undefined") return;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070c1a);

      camera = new THREE.PerspectiveCamera(
        48,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );
      camera.position.set(0, 9.2, 10.6);
      camera.lookAt(0, 1.3, -2.2);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfffbeb, 0.9);
      dirLight.position.set(5, 12, 7);
      scene.add(dirLight);

      buildHalfCourt();
      createBallMesh();
    }

    function updateActionButtonLabel() {
      const btn = document.getElementById("btn-pass-or-steal");
      if (!btn) return;
      btn.textContent = playerEntries.find((p) => p.id === ballOwnerId)?.team === "home"
        ? "🤝 傳球"
        : "🛡️ 搶球";
    }

    function resetPositions(nextOwnerId) {
      isBallInFlight = false;
      ballFlightMode = null;
      ballFlightProgress = 0;
      ballPassTargetId = null;
      pendingShotWillScore = false;
      opponentStealTimer = 0;
      aiShotCooldown = 2.0;

      const homeStart = [
        { x: 0, z: 2.2 },
        { x: -3.0, z: 0.8 },
        { x: 3.0, z: 0.8 }
      ];
      const awayStart = [
        { x: 0, z: -1.6 },
        { x: -2.4, z: -3.4 },
        { x: 2.4, z: -3.4 }
      ];

      for (const p of playerEntries) {
        p.jumpOffset = 0;
        p.jumpVel = 0;
        if (p.team === "home") {
          p.pos.set(homeStart[p.slotIndex].x, 0, homeStart[p.slotIndex].z);
        } else {
          p.pos.set(awayStart[p.slotIndex].x, 0, awayStart[p.slotIndex].z);
        }
        if (p.meshGroup) {
          p.meshGroup.position.copy(p.pos);
        }
      }

      ballOwnerId = nextOwnerId || "home_0";
      if (ballOwnerId.startsWith("home_")) {
        controlledHomeIndex = Number(ballOwnerId.split("_")[1]) || 0;
      }
      updateActionButtonLabel();
    }

    function launchBallFlight(startVec, targetVec, mode, durationSec, passTargetId) {
      isBallInFlight = true;
      ballFlightMode = mode;
      ballFlightProgress = 0;
      ballFlightDuration = durationSec || 0.65;
      ballStartPos.copy(startVec);
      ballTargetPos.copy(targetVec);
      ballPassTargetId = passTargetId || null;
    }

    function handlePassOrSteal() {
      if (isAtHomeScreen || isGameOver || isQuizOpen || isWaitingWrongAnswerAck || isBallInFlight) return;

      const owner = playerEntries.find((p) => p.id === ballOwnerId);
      const activeHome = playerEntries.find((p) => p.team === "home" && p.slotIndex === controlledHomeIndex)
        || playerEntries.find((p) => p.team === "home");

      if (owner && owner.team === "home") {
        const teammates = playerEntries.filter((p) => p.team === "home" && p.id !== owner.id);
        if (teammates.length === 0) return;
        teammates.sort((a, b) => a.pos.distanceTo(owner.pos) - b.pos.distanceTo(owner.pos));
        const targetMate = teammates[0];
        controlledHomeIndex = targetMate.slotIndex;
        const startVec = new THREE.Vector3(owner.pos.x, 1.2, owner.pos.z);
        const endVec = new THREE.Vector3(targetMate.pos.x, 1.2, targetMate.pos.z);
        launchBallFlight(startVec, endVec, "pass", 0.42, targetMate.id);
        setStatusBanner(`🤝 ${targetMate.spec.name}`);
      } else if (owner && owner.team === "away" && activeHome) {
        const dist = activeHome.pos.distanceTo(owner.pos);
        if (dist <= 2.3) {
          ballOwnerId = activeHome.id;
          opponentStealTimer = 0;
          updateActionButtonLabel();
          spawnShotEffectBurst(activeHome.pos.clone().add(new THREE.Vector3(0, 1.0, 0)), 0x38bdf8, false);
          setStatusBanner(`🛡️ ${activeHome.spec.name}`);
        } else {
          setStatusBanner("靠近對手再搶球");
        }
      }
    }

    function openShotQuiz() {
      if (isAtHomeScreen || isGameOver || isQuizOpen || isWaitingWrongAnswerAck || isBallInFlight) return;

      const owner = playerEntries.find((p) => p.id === ballOwnerId);
      if (!owner || owner.team !== "home") {
        setStatusBanner("球不在我方，請靠近對手按「搶球」");
        return;
      }

      const shooter = owner;
      controlledHomeIndex = shooter.slotIndex;
      updateActionButtonLabel();

      const is3 = isThreePointShot(shooter.pos);
      pendingShotPoints = is3 ? 3 : 2;
      pendingShotTeam = "home";

      currentQuestion = pickNextQuestion(is3);
      isQuizOpen = true;
      isWaitingWrongAnswerAck = false;

      const modal = document.getElementById("quiz-modal");
      document.getElementById("quiz-shot-badge").textContent = is3 ? "三分球 (+3)" : "兩分球 (+2)";
      document.getElementById("quiz-subject-badge").textContent = currentQuestion.subject;
      document.getElementById("quiz-question-text").textContent = currentQuestion.question;
      document.getElementById("quiz-wrong-feedback").classList.add("hidden");

      const optBox = document.getElementById("quiz-options-container");
      optBox.innerHTML = "";
      const labels = ["A", "B", "C", "D"];

      currentQuestion.options.forEach((optText, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "action-btn w-full text-left px-4 py-3 bg-slate-800/95 hover:bg-slate-700 text-white border border-slate-600 text-sm sm:text-base";
        btn.textContent = `${labels[idx]}. ${optText}`;
        btn.addEventListener("click", () => {
          if (!isQuizOpen || isWaitingWrongAnswerAck) return;
          handleAnswerQuiz(optText, shooter);
        });
        optBox.appendChild(btn);
      });

      modal.classList.add("active");
    }

    function finishShotAnimation(scored) {
      isBallInFlight = false;
      ballFlightMode = null;
      ballFlightProgress = 0;
      ballPassTargetId = null;
      if (moveAuraMesh) moveAuraMesh.visible = false;
      if (ballMesh && ballMesh.material) ballMesh.material.color.setHex(0xf97316);

      if (scored) {
        if (pendingShotTeam === "home") {
          homeScore += pendingShotPoints;
          spawnShotEffectBurst(HOOP_POS.clone(), 0xfacc15, true);
          setStatusBanner(`🎉 +${pendingShotPoints} 分！`);
          resetPositions("away_0");
        } else {
          awayScore += pendingShotPoints;
          spawnShotEffectBurst(HOOP_POS.clone(), 0xf87171, true);
          setStatusBanner(`對手 +${pendingShotPoints} 分`);
          resetPositions("home_0");
        }
        updateScoreboardUI();
      } else {
        spawnShotEffectBurst(HOOP_POS.clone(), 0x94a3b8, false);
        const nextOwner = pendingShotTeam === "home" ? "away_0" : "home_0";
        setStatusBanner(pendingShotTeam === "home" ? "答錯不入！" : "未命中！");
        resetPositions(nextOwner);
      }
      pendingShotWillScore = false;
    }

    function handleAnswerQuiz(chosenOption, shooter) {
      if (!isQuizOpen || !currentQuestion) return;
      const isCorrect = String(chosenOption).trim() === String(currentQuestion.answer).trim();
      const modal = document.getElementById("quiz-modal");

      if (isCorrect) {
        isQuizOpen = false;
        isWaitingWrongAnswerAck = false;
        modal.classList.remove("active");
        const moveSpec = getSignatureMoveByPokemon(shooter?.spec);
        currentShotArcHeight = moveSpec.arc || 2.3;
        pendingShotWillScore = true;

        if (shooter) {
          shooter.jumpVel = 6.2;
          if (moveAuraMesh) {
            moveAuraMesh.visible = true;
            moveAuraMesh.material.color.setHex(moveSpec.color);
            moveAuraMesh.position.set(shooter.pos.x, 0.25, shooter.pos.z);
          }
        }
        if (ballMesh && ballMesh.material) {
          ballMesh.material.color.setHex(moveSpec.color);
        }
        showMoveEffectBanner(`⚡ ${moveSpec.name}`);

        const startVec = new THREE.Vector3(shooter ? shooter.pos.x : 0, 1.5, shooter ? shooter.pos.z : 1.5);
        launchBallFlight(startVec, HOOP_POS.clone(), "shot", 0.72, null);
      } else {
        isWaitingWrongAnswerAck = true;
        document.getElementById("quiz-correct-answer-display").textContent = `正確答案：${currentQuestion.answer}`;
        document.getElementById("quiz-wrong-feedback").classList.remove("hidden");
      }
    }

    function acknowledgeWrongAnswer() {
      if (!isWaitingWrongAnswerAck) return;
      isWaitingWrongAnswerAck = false;
      isQuizOpen = false;
      currentQuestion = null;
      document.getElementById("quiz-modal").classList.remove("active");
      document.getElementById("quiz-wrong-feedback").classList.add("hidden");

      const shooter = playerEntries.find((p) => p.id === ballOwnerId) || playerEntries.find((p) => p.team === "home");
      currentShotArcHeight = 2.0;
      pendingShotWillScore = false;
      const startVec = new THREE.Vector3(shooter ? shooter.pos.x : 0, 1.4, shooter ? shooter.pos.z : 1.5);
      const missTarget = new THREE.Vector3(
        HOOP_POS.x + (Math.random() < 0.5 ? -1.1 : 1.1),
        HOOP_POS.y - 0.25,
        HOOP_POS.z + 0.5
      );
      launchBallFlight(startVec, missTarget, "shot", 0.65, null);
    }

    function updateScoreboardUI() {
      const hEl = document.getElementById("hud-home-score");
      const aEl = document.getElementById("hud-away-score");
      const tEl = document.getElementById("hud-timer");
      if (hEl) hEl.textContent = String(homeScore);
      if (aEl) aEl.textContent = String(awayScore);
      if (tEl) {
        const sec = Math.max(0, Math.ceil(matchTimeLeft));
        const mm = String(Math.floor(sec / 60)).padStart(2, "0");
        const ss = String(sec % 60).padStart(2, "0");
        tEl.textContent = `${mm}:${ss}`;
      }
    }

    function recordCompletedMatchResult() {
      const rec = window.matchRecord || matchRecord;
      const diff = homeScore - awayScore;
      const won = homeScore > awayScore;

      rec.matchesPlayed = (Number(rec.matchesPlayed) || 0) + 1;
      if (won) {
        rec.wins = (Number(rec.wins) || 0) + 1;
      }
      if (homeScore > (Number(rec.bestHomeScore) || 0)) {
        rec.bestHomeScore = homeScore;
      }
      if (!Number.isFinite(Number(rec.bestGoalDiff)) || diff > Number(rec.bestGoalDiff)) {
        rec.bestGoalDiff = diff;
      }

      matchRecord = rec;
      window.matchRecord = rec;
      syncMatchRecordUI();

      if (typeof window.saveGameProgress === "function") {
        window.saveGameProgress();
      }
    }

    function syncMatchRecordUI() {
      const rec = window.matchRecord || matchRecord;
      const el = document.getElementById("home-record-summary");
      if (el) {
        const diffVal = Number.isFinite(Number(rec.bestGoalDiff)) && Number(rec.bestGoalDiff) > -900
          ? (Number(rec.bestGoalDiff) >= 0 ? `+${rec.bestGoalDiff}` : `${rec.bestGoalDiff}`)
          : "0";
        el.textContent = `最佳紀錄：${rec.bestHomeScore || 0} 分（淨勝 ${diffVal}）｜勝場 ${rec.wins || 0}/${rec.matchesPlayed || 0}`;
      }
    }

    window.syncMatchRecordUI = syncMatchRecordUI;

    function updateMatchTimer(dt) {
      if (isAtHomeScreen || isGameOver || isQuizOpen || isWaitingWrongAnswerAck) return;
      matchTimeLeft = Math.max(0, matchTimeLeft - dt);
      updateScoreboardUI();
      if (matchTimeLeft <= 0) {
        triggerGameOver();
      }
    }

    function triggerGameOver() {
      isGameOver = true;
      isQuizOpen = false;
      isWaitingWrongAnswerAck = false;
      document.getElementById("quiz-modal").classList.remove("active");

      recordCompletedMatchResult();

      const won = homeScore > awayScore;
      const draw = homeScore === awayScore;
      const badge = document.getElementById("gameover-badge");
      const title = document.getElementById("gameover-title");
      const scoreText = document.getElementById("gameover-score");
      const unlockBox = document.getElementById("gameover-unlock-box");

      scoreText.textContent = `主隊 ${homeScore} : ${awayScore} 對手`;

      if (won) {
        badge.textContent = "勝利";
        title.textContent = "主隊獲勝！";
        const lockedList = POKEMON_CATALOG.filter((p) => !unlockedPokemonIds.has(p.id));
        if (lockedList.length > 0) {
          const picked = lockedList[Math.floor(Math.random() * lockedList.length)];
          unlockedPokemonIds.add(picked.id);
          window.unlockedPokemonIds = unlockedPokemonIds;
          if (typeof window.saveGameProgress === "function") {
            window.saveGameProgress();
          }
          unlockBox.innerHTML = `<div class="font-extrabold text-amber-300">🎉 解鎖新寶可夢：${picked.name}（${picked.dexNo}）</div>`;
        } else {
          unlockBox.innerHTML = `<div class="font-extrabold text-emerald-300">全 1025 隻寶可夢已全數解鎖！</div>`;
        }
      } else if (draw) {
        badge.textContent = "平手";
        title.textContent = "平手";
        unlockBox.innerHTML = `<div class="text-slate-300">再贏一場即可解鎖新寶可夢！</div>`;
      } else {
        badge.textContent = "結束";
        title.textContent = "對手勝出";
        unlockBox.innerHTML = `<div class="text-slate-300">再接再厲，贏得比賽即可解鎖新寶可夢！</div>`;
      }

      renderHomeScreen();
      document.getElementById("gameover-modal").classList.add("active");
    }

    function startNewMatch(fromHome) {
      if (!fromHome && !isAtHomeScreen && !isGameOver && (homeScore > 0 || awayScore > 0 || matchTimeLeft < MATCH_DURATION_SECONDS)) {
        recordCompletedMatchResult();
      }
      const latestUnlocked = new Set([
        ...INITIAL_UNLOCKED_IDS,
        ...unlockedPokemonIds,
        ...(window.unlockedPokemonIds || [])
      ]);
      unlockedPokemonIds = latestUnlocked;
      window.unlockedPokemonIds = latestUnlocked;

      const latestSelected = Array.isArray(window.selectedHomeIds) && window.selectedHomeIds.length > 0
        ? window.selectedHomeIds
        : selectedHomeIds;
      const validSelected = (latestSelected || []).filter((id) => unlockedPokemonIds.has(id));
      if (validSelected.length === 3) {
        selectedHomeIds = validSelected;
      } else {
        const fallbackPool = Array.from(unlockedPokemonIds);
        selectedHomeIds = fallbackPool.slice(0, 3);
        while (selectedHomeIds.length < 3) {
          selectedHomeIds.push(INITIAL_UNLOCKED_IDS[selectedHomeIds.length] || 7);
        }
      }
      window.selectedHomeIds = selectedHomeIds;

      isAtHomeScreen = false;
      isGameOver = false;
      isQuizOpen = false;
      isWaitingWrongAnswerAck = false;
      matchTimeLeft = MATCH_DURATION_SECONDS;
      homeScore = 0;
      awayScore = 0;
      usedMatchQuestionKeys.clear();
      usedMatchQuestionIndices.clear();
      saveQuestionRotationState();
      subjectRotationIndex = Math.floor(Math.random() * 4);
      opponentStealTimer = 0;

      document.getElementById("home-screen").classList.remove("active");
      document.getElementById("gameover-modal").classList.remove("active");
      document.getElementById("dex-modal").classList.remove("active");
      document.getElementById("quiz-modal").classList.remove("active");

      spawnTeamPlayers();
      resetPositions("home_0");
      updateScoreboardUI();
      syncMatchRecordUI();
      renderHomeScreen();
      if (typeof window.saveGameProgress === "function") {
        window.saveGameProgress();
      }
      setStatusBanner(fromHome ? "01:00" : "已重開");
    }

    function returnToHomeScreen() {
      isAtHomeScreen = true;
      isQuizOpen = false;
      isWaitingWrongAnswerAck = false;
      document.getElementById("quiz-modal").classList.remove("active");
      document.getElementById("dex-modal").classList.remove("active");
      document.getElementById("gameover-modal").classList.remove("active");
      document.getElementById("home-screen").classList.add("active");
      renderHomeScreen();
    }

    function swapControlledHomePlayer() {
      if (isAtHomeScreen || isGameOver || isQuizOpen || isWaitingWrongAnswerAck) return;
      const homePlayers = playerEntries.filter((p) => p.team === "home");
      if (homePlayers.length === 0) return;

      const owner = playerEntries.find((p) => p.id === ballOwnerId);
      controlledHomeIndex = (controlledHomeIndex + 1) % homePlayers.length;
      const nextPlayer = homePlayers.find((p) => p.slotIndex === controlledHomeIndex) || homePlayers[0];

      if (owner && owner.team === "home" && !isBallInFlight) {
        ballOwnerId = nextPlayer.id;
        updateActionButtonLabel();
      }
      setStatusBanner(`🔄 ${nextPlayer.spec.name}`);
    }

    function toggleSelectHomePokemon(id) {
      if (!unlockedPokemonIds.has(id)) return;
      const idx = selectedHomeIds.indexOf(id);
      if (idx !== -1) {
        if (selectedHomeIds.length <= 1) return;
        selectedHomeIds.splice(idx, 1);
      } else {
        if (selectedHomeIds.length >= 3) {
          selectedHomeIds.shift();
        }
        selectedHomeIds.push(id);
      }
      window.selectedHomeIds = selectedHomeIds;
      if (typeof window.saveGameProgress === "function") {
        window.saveGameProgress();
      }
      renderHomeScreen();
    }

    function renderHomeScreen() {
      try {
        unlockedPokemonIds = new Set([...INITIAL_UNLOCKED_IDS, ...(window.unlockedPokemonIds || [])]);
        window.unlockedPokemonIds = unlockedPokemonIds;
        window.selectedHomeIds = selectedHomeIds;

        const counterEl = document.getElementById("home-unlock-counter");
        const selCountEl = document.getElementById("home-selected-count");
        const slotsEl = document.getElementById("home-selected-slots");
        const gridEl = document.getElementById("home-roster-grid");

        if (counterEl) counterEl.textContent = `${unlockedPokemonIds.size}/1025`;
        if (selCountEl) selCountEl.textContent = `(${selectedHomeIds.length}/3)`;
        syncMatchRecordUI();

        if (slotsEl) {
          slotsEl.innerHTML = "";
          for (let i = 0; i < 3; i++) {
            const pid = selectedHomeIds[i];
            const spec = pid ? POKEMON_MAP.get(pid) : null;
            const card = document.createElement("div");
            card.className = "p-3 rounded-2xl bg-slate-900/90 border border-amber-400/35 flex items-center gap-3";
            if (spec) {
              card.innerHTML = `
                <span class="px-2 py-0.5 rounded-lg text-xs font-black bg-amber-400 text-slate-950">#${i + 1}</span>
                <img src="${spec.sprite}" alt="${spec.name}" onerror="this.onerror=null;this.src='${spec.fallbackSprite}';" class="w-11 h-11 object-contain" />
                <div class="min-w-0">
                  <div class="text-sm font-extrabold text-white truncate">${spec.name}</div>
                  <div class="text-xs text-slate-400">${spec.dexNo}</div>
                </div>
              `;
              if (!KNOWN_POKEMON_NAMES[spec.id] && !fetchedRemotePokemonNames.has(spec.id)) {
                hydratePokemonNames([spec.id]);
              }
            } else {
              card.innerHTML = `
                <span class="px-2 py-0.5 rounded-lg text-xs font-black bg-slate-700 text-slate-300">#${i + 1}</span>
                <div class="text-xs text-slate-400">未選擇</div>
              `;
            }
            slotsEl.appendChild(card);
          }
        }

        if (gridEl) {
          gridEl.innerHTML = "";
          const sortedCatalog = [...POKEMON_CATALOG].sort((a, b) => {
            const aUn = unlockedPokemonIds.has(a.id) ? 0 : 1;
            const bUn = unlockedPokemonIds.has(b.id) ? 0 : 1;
            if (aUn !== bUn) return aUn - bUn;
            return a.id - b.id;
          });

          for (const spec of sortedCatalog) {
            const isUnlocked = unlockedPokemonIds.has(spec.id);
            const isSelected = selectedHomeIds.includes(spec.id);
            const item = document.createElement("button");
            item.type = "button";
            item.className = `pokemon-card p-3 flex flex-col items-center text-center gap-1.5 ${
              !isUnlocked ? "locked-card" : ""
            } ${isSelected ? "selected-home" : ""}`;

            item.innerHTML = `
              <div class="w-full flex items-center justify-between text-[11px] font-bold">
                <span class="text-slate-400">${spec.dexNo}</span>
                ${
                  isSelected
                    ? `<span class="px-1.5 py-0.5 rounded bg-amber-400 text-slate-950 font-black">出賽</span>`
                    : isUnlocked
                    ? `<span class="text-emerald-400">已解鎖</span>`
                    : `<span class="text-slate-500">未解鎖</span>`
                }
              </div>
              <img src="${spec.sprite}" alt="${spec.name}" loading="lazy" onerror="this.onerror=null;this.src='${spec.fallbackSprite}';" class="w-16 h-16 object-contain ${!isUnlocked ? "grayscale brightness-50" : ""}" />
              <div class="text-xs font-extrabold text-white truncate w-full">${isUnlocked ? spec.name : spec.dexNo}</div>
            `;

            if (isUnlocked) {
              item.addEventListener("click", () => toggleSelectHomePokemon(spec.id));
              if (!KNOWN_POKEMON_NAMES[spec.id] && !fetchedRemotePokemonNames.has(spec.id)) {
                hydratePokemonNames([spec.id]);
              }
            }
            gridEl.appendChild(item);
          }
        }
      } catch (err) {
        console.error("Failed to render home screen:", err);
      }
    }

    function openDexModal() {
      const grid = document.getElementById("dex-grid");
      const summary = document.getElementById("dex-unlock-summary");
      if (summary) {
        summary.textContent = `${unlockedPokemonIds.size} / 1025`;
      }
      if (grid) {
        grid.innerHTML = "";
        const idsToHydrate = [];
        for (const spec of POKEMON_CATALOG) {
          const isUnlocked = unlockedPokemonIds.has(spec.id);
          if (isUnlocked && !KNOWN_POKEMON_NAMES[spec.id] && !fetchedRemotePokemonNames.has(spec.id)) {
            idsToHydrate.push(spec.id);
          }
          const card = document.createElement("div");
          card.className = `pokemon-card p-3 flex flex-col items-center text-center gap-1.5 ${
            !isUnlocked ? "locked-card" : ""
          }`;
          card.innerHTML = `
            <div class="w-full flex items-center justify-between text-[11px] font-bold">
              <span class="text-slate-400">${spec.dexNo}</span>
              <span class="${isUnlocked ? "text-emerald-400" : "text-slate-500"}">${isUnlocked ? "已解鎖" : "未解鎖"}</span>
            </div>
            <img src="${spec.sprite}" alt="${spec.name}" loading="lazy" onerror="this.onerror=null;this.src='${spec.fallbackSprite}';" class="w-16 h-16 object-contain ${!isUnlocked ? "grayscale brightness-50" : ""}" />
            <div class="text-xs font-extrabold text-white line-clamp-1">${isUnlocked ? spec.name : spec.dexNo}</div>
          `;
          grid.appendChild(card);
        }
        if (idsToHydrate.length > 0) {
          hydratePokemonNames(idsToHydrate);
        }
      }
      document.getElementById("dex-modal").classList.add("active");
    }

    function closeDexModal() {
      document.getElementById("dex-modal").classList.remove("active");
    }

    function getMoveInputVector() {
      let ix = joystickState.vecX;
      let iy = joystickState.vecY;
      if (keysPressed.ArrowLeft || keysPressed.KeyA) ix -= 1;
      if (keysPressed.ArrowRight || keysPressed.KeyD) ix += 1;
      if (keysPressed.ArrowUp || keysPressed.KeyW) iy -= 1;
      if (keysPressed.ArrowDown || keysPressed.KeyS) iy += 1;
      const len = Math.hypot(ix, iy);
      if (len > 1) {
        ix /= len;
        iy /= len;
      }
      return { x: ix, z: iy };
    }

    function updatePlayersAndAI(dt) {
      if (isAtHomeScreen || isGameOver || isQuizOpen || isWaitingWrongAnswerAck) return;

      const elapsed = performance.now() * 0.001;
      const moveInput = getMoveInputVector();
      const owner = playerEntries.find((p) => p.id === ballOwnerId);
      const homeHasBall = Boolean(owner && owner.team === "home" && !isBallInFlight);

      if (homeHasBall) {
        opponentStealTimer += dt;
        if (opponentStealTimer >= OPPONENT_STEAL_INTERVAL_SECONDS) {
          opponentStealTimer = 0;
          const awayPlayers = playerEntries.filter((p) => p.team === "away");
          if (awayPlayers.length > 0) {
            awayPlayers.sort((a, b) => a.pos.distanceTo(owner.pos) - b.pos.distanceTo(owner.pos));
            const stealer = awayPlayers[0];
            const approachDir = owner.pos.clone().sub(stealer.pos);
            if (approachDir.length() > 0.7) {
              approachDir.normalize();
              stealer.pos.addScaledVector(approachDir, 1.35);
              clampToCourt(stealer.pos);
            }
            stealer.jumpVel = 4.2;

            if (Math.random() < OPPONENT_STEAL_CHANCE) {
              ballOwnerId = stealer.id;
              aiShotCooldown = 2.0;
              updateActionButtonLabel();
              spawnShotEffectBurst(stealer.pos.clone().add(new THREE.Vector3(0, 1.0, 0)), 0xf87171, false);
              setStatusBanner(`⚠️ 對手 ${stealer.spec.name} 搶球成功！`);
            } else {
              spawnShotEffectBurst(owner.pos.clone().add(new THREE.Vector3(0, 1.0, 0)), 0x38bdf8, false);
              setStatusBanner(`🛡️ 防守成功！保住球權`);
            }
          }
        }
      } else {
        opponentStealTimer = 0;
      }

      const activeHome = playerEntries.find((p) => p.team === "home" && p.slotIndex === controlledHomeIndex)
        || playerEntries.find((p) => p.team === "home");

      if (activeHome && (Math.abs(moveInput.x) > 0.02 || Math.abs(moveInput.z) > 0.02)) {
        const speed = 5.8;
        activeHome.pos.x += moveInput.x * speed * dt;
        activeHome.pos.z += moveInput.z * speed * dt;
        clampToCourt(activeHome.pos);
      }

      const homeAnchors = [
        { x: 0, z: 2.2 },
        { x: -2.9, z: 0.6 },
        { x: 2.9, z: 0.6 }
      ];
      const awayAnchors = [
        { x: 0, z: -1.6 },
        { x: -2.5, z: -3.2 },
        { x: 2.5, z: -3.2 }
      ];

      for (const p of playerEntries) {
        if (p.team === "home") {
          if (!activeHome || p.id !== activeHome.id) {
            const anchor = homeAnchors[p.slotIndex] || homeAnchors[0];
            const targetX = anchor.x + Math.sin(elapsed * 1.6 + p.slotIndex * 1.7) * 1.15;
            const targetZ = anchor.z + Math.cos(elapsed * 1.3 + p.slotIndex * 1.2) * 0.85;
            const toTarget = new THREE.Vector3(targetX - p.pos.x, 0, targetZ - p.pos.z);
            if (toTarget.length() > 0.08) {
              toTarget.normalize();
              p.pos.addScaledVector(toTarget, 2.3 * dt);
              clampToCourt(p.pos);
            }
          }
        } else if (p.team === "away") {
          const isBallCarrier = p.id === ballOwnerId;
          if (isBallCarrier && !isBallInFlight) {
            aiShotCooldown = Math.max(0, aiShotCooldown - dt);
            const shootSpot = new THREE.Vector3(
              Math.sin(elapsed * 1.2) * 1.4,
              0,
              -2.5
            );
            const distToSpot = p.pos.distanceTo(shootSpot);
            if (distToSpot > 0.35) {
              const dir = shootSpot.clone().sub(p.pos).normalize();
              p.pos.addScaledVector(dir, 3.5 * dt);
              clampToCourt(p.pos);
            } else if (aiShotCooldown <= 0) {
              aiShotCooldown = 2.5;
              pendingShotTeam = "away";
              pendingShotPoints = isThreePointShot(p.pos) ? 3 : 2;
              pendingShotWillScore = Math.random() < 0.35;
              currentShotArcHeight = 2.15;
              p.jumpVel = 5.4;
              const startVec = new THREE.Vector3(p.pos.x, 1.4, p.pos.z);
              const endVec = pendingShotWillScore
                ? HOOP_POS.clone()
                : new THREE.Vector3(HOOP_POS.x + 1.0, HOOP_POS.y - 0.3, HOOP_POS.z + 0.4);
              launchBallFlight(startVec, endVec, "shot", 0.7, null);
            }
          } else {
            const anchor = awayAnchors[p.slotIndex] || awayAnchors[0];
            const focusTarget = (activeHome && p.slotIndex === 0)
              ? new THREE.Vector3(activeHome.pos.x * 0.75, 0, Math.max(-4.5, activeHome.pos.z - 1.6))
              : new THREE.Vector3(
                  anchor.x + Math.cos(elapsed * 1.5 + p.slotIndex * 2.1) * 1.35,
                  0,
                  anchor.z + Math.sin(elapsed * 1.4 + p.slotIndex * 1.5) * 0.95
                );
            const dir = focusTarget.clone().sub(p.pos);
            if (dir.length() > 0.08) {
              dir.normalize();
              p.pos.addScaledVector(dir, 2.7 * dt);
              clampToCourt(p.pos);
            }
          }
        }

        if (p.jumpOffset > 0 || p.jumpVel > 0) {
          p.jumpOffset += p.jumpVel * dt;
          p.jumpVel -= 18 * dt;
          if (p.jumpOffset <= 0) {
            p.jumpOffset = 0;
            p.jumpVel = 0;
          }
        }
        const idleBob = p.jumpOffset === 0 ? Math.abs(Math.sin(elapsed * 4.2 + p.slotIndex)) * 0.08 : 0;
        if (p.meshGroup) {
          p.meshGroup.position.set(p.pos.x, p.jumpOffset + idleBob, p.pos.z);
        }
        if (p.ringMesh) {
          const isControlled = p.team === "home" && p.slotIndex === controlledHomeIndex;
          const hasBall = p.id === ballOwnerId;
          const scale = hasBall ? 1.24 : isControlled ? 1.12 : 1.0;
          p.ringMesh.scale.setScalar(scale);
        }
      }

      if (moveAuraMesh && moveAuraMesh.visible && activeHome) {
        moveAuraMesh.position.set(activeHome.pos.x, 0.25, activeHome.pos.z);
      }
    }

    function updateBall(dt) {
      if (!ballMesh) return;

      if (isBallInFlight) {
        ballFlightProgress += dt / Math.max(0.1, ballFlightDuration);
        const t = Math.min(1, ballFlightProgress);
        ballMesh.position.lerpVectors(ballStartPos, ballTargetPos, t);

        if (ballFlightMode === "shot") {
          ballMesh.position.y += Math.sin(t * Math.PI) * currentShotArcHeight;
        } else if (ballFlightMode === "pass") {
          ballMesh.position.y += Math.sin(t * Math.PI) * 0.55;
        }

        if (t >= 1) {
          const finishedMode = ballFlightMode;
          const passTarget = ballPassTargetId;
          isBallInFlight = false;
          ballFlightMode = null;
          ballFlightProgress = 0;
          ballPassTargetId = null;

          if (moveAuraMesh) moveAuraMesh.visible = false;
          if (ballMesh.material) ballMesh.material.color.setHex(0xf97316);

          if (finishedMode === "pass" && passTarget) {
            ballOwnerId = passTarget;
            updateActionButtonLabel();
          } else if (finishedMode === "shot") {
            finishShotAnimation(pendingShotWillScore);
          }
        }
        return;
      }

      const owner = playerEntries.find((p) => p.id === ballOwnerId) || playerEntries[0];
      if (owner) {
        const sideOffset = owner.team === "home" ? 0.36 : -0.36;
        ballMesh.position.set(owner.pos.x + sideOffset, 0.34 + owner.jumpOffset, owner.pos.z + 0.18);
      }
    }

    let lastFrameTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const safeNow = typeof now === "number" && Number.isFinite(now) ? now : performance.now();
      const rawDelta = (safeNow - lastFrameTime) / 1000;
      const dt = rawDelta > 0 && rawDelta < 0.08 ? rawDelta : 0.016;
      lastFrameTime = safeNow;

      updateMatchTimer(dt);
      updatePlayersAndAI(dt);
      updateBall(dt);
      updateShotParticles(dt);

      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    function bindJoystickEvents() {
      const zone = document.getElementById("joystick-zone");
      const knob = document.getElementById("joystick-knob");
      if (!zone || !knob) return;

      function updateKnobFromClient(clientX, clientY) {
        const rect = zone.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = clientX - cx;
        let dy = clientY - cy;
        const dist = Math.hypot(dx, dy);
        const maxR = joystickState.maxRadius;
        if (dist > maxR && dist > 0) {
          dx = (dx / dist) * maxR;
          dy = (dy / dist) * maxR;
        }
        knob.style.transform = `translate(${dx}px, ${dy}px)`;
        joystickState.vecX = dx / maxR;
        joystickState.vecY = dy / maxR;
      }

      function resetKnob() {
        joystickState.active = false;
        joystickState.pointerId = null;
        joystickState.vecX = 0;
        joystickState.vecY = 0;
        knob.classList.remove("dragging");
        knob.style.transform = "translate(0px, 0px)";
      }

      zone.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        joystickState.active = true;
        joystickState.pointerId = e.pointerId;
        knob.classList.add("dragging");
        zone.setPointerCapture?.(e.pointerId);
        updateKnobFromClient(e.clientX, e.clientY);
      });

      zone.addEventListener("pointermove", (e) => {
        if (!joystickState.active || e.pointerId !== joystickState.pointerId) return;
        e.preventDefault();
        updateKnobFromClient(e.clientX, e.clientY);
      });

      zone.addEventListener("pointerup", (e) => {
        if (e.pointerId === joystickState.pointerId) {
          resetKnob();
        }
      });

      zone.addEventListener("pointercancel", (e) => {
        if (e.pointerId === joystickState.pointerId) {
          resetKnob();
        }
      });
    }

    function bindEvents() {
      document.getElementById("home-start-match-btn")?.addEventListener("click", () => startNewMatch(true));
      document.getElementById("home-open-dex-btn")?.addEventListener("click", openDexModal);
      document.getElementById("btn-home-screen")?.addEventListener("click", returnToHomeScreen);
      document.getElementById("btn-swap-player")?.addEventListener("click", swapControlledHomePlayer);
      document.getElementById("btn-open-dex")?.addEventListener("click", openDexModal);
      document.getElementById("btn-close-dex")?.addEventListener("click", closeDexModal);
      document.getElementById("btn-restart")?.addEventListener("click", () => startNewMatch(false));
      document.getElementById("btn-pass-or-steal")?.addEventListener("click", handlePassOrSteal);
      document.getElementById("btn-shoot")?.addEventListener("click", openShotQuiz);
      document.getElementById("btn-ack-wrong-answer")?.addEventListener("click", acknowledgeWrongAnswer);
      document.getElementById("btn-gameover-home")?.addEventListener("click", returnToHomeScreen);
      document.getElementById("btn-gameover-rematch")?.addEventListener("click", () => startNewMatch(false));

      bindJoystickEvents();

      window.addEventListener("keydown", (e) => {
        if (e.code in keysPressed) {
          keysPressed[e.code] = true;
        }
      });

      window.addEventListener("keyup", (e) => {
        if (e.code in keysPressed) {
          keysPressed[e.code] = false;
        }
      });

      window.addEventListener("resize", () => {
        if (!renderer || !camera) return;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    window.renderHomeScreen = renderHomeScreen;
    window.openDexModal = openDexModal;

    function bootHomeAndGame() {
      initScene();
      spawnTeamPlayers();
      renderHomeScreen();
      updateScoreboardUI();
      syncMatchRecordUI();
      bindEvents();
      lastFrameTime = performance.now();
      requestAnimationFrame(animate);
    }

    if (document.readyState === "loading") {
      window.addEventListener("DOMContentLoaded", bootHomeAndGame);
    } else {
      bootHomeAndGame();
    }
  </script>
</body>
